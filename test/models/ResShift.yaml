args:
  c: 1
  nc: 14

modules: # Specify the module sequence
  - conv
  - ResBlock_1
  - ResBlock_2
  - ResBlock_3
  - flatten
  - fc
conv:
  # B,c,224,224

  # [inputs, repeat_num, module, construction_parameters]
  - [-1, 1, Conv2d, [c, 3, 3, 1, 1]] 
  - [-1, 1, Sigmoid, []] # n： Retrieve parameters from args
  - [-1, 1, Conv2d, [3, 64, 7, 2, 3]]  # 224 -> 112, in_channel=1, out_channel = 64, kernel_size=7, stride=2, padding = 0,
  - [-1, 1, Sigmoid, []] # n： Retrieve parameters from args

ResBlock_1:
  # B,16,112,112
  - [-1, 2, ResidualBlockShift, [64, 1.0]]  # channel = 64, scale = 1.0
  # B,64,112,112
  # AvgPool2d -> B,64,112//2,112//2]
  - [-1, 1, AvgPool2d, [2, 2]]
  - [conv.-1, 1, AvgPool2d, [2, 2]]
  - [[ResBlock_1.1,ResBlock_1.2], 1, SEFusion, [64, 64]] # SE Attention Fusion
  # B,64,56,56
  - [-1, 1, Conv2d, [64, 128, 3, 1, 1]]
  # B,128,56,56
  - [-1, 1, Sigmoid, []]
  
ResBlock_2:
  # B,64,56,56
  - [-1, 2, ResidualBlockShift, [128, 1.0]]
  # B,128,56,56
  # AvgPool2d -> B,128,56//2,56//2
  - [-1, 1, AvgPool2d, [2, 2]]
  - [ResBlock_1.-1, 1, AvgPool2d, [2, 2]]
  - [[ResBlock_2.1,ResBlock_2.2], 1, SEFusion, [128, 128]]
  # B,128,28,28
  - [-1, 1, Conv2d, [128, 256, 3, 1, 1]]
  # B,256,28,28
  - [-1, 1, Sigmoid, []]

ResBlock_3:
  # B,128,28,28
  - [-1, 2, ResidualBlockShift, [256, 1.0]]
  # B,256,28,28
  # AvgPool2d -> B,256,28//2,28//2
  - [-1, 1, AvgPool2d, [2, 2]]
  - [ResBlock_2.-1, 1, AvgPool2d, [2, 2]]
  - [[ResBlock_3.1,ResBlock_3.2], 1, SEFusion, [256, 256]]
  # B,256,14,14
  - [-1, 1, Conv2d, [256, 512, 3, 1, 1]]
  # B,512,14,14
  - [-1, 1, Sigmoid, []]

flatten:
  # B,256,14,14
  - [-1, 2, ResidualBlockShift, [512, 1.0]]
  # B,512,14,14
  # AvgPool2d -> B,512,1,1
  - [-1, 1, AvgPool2d, [14, 14]]
  # B,512,1,1
  - [-1, 1, Flatten, []]
  # B,512

fc:
  # B,512
  - [-1, 1, Linear, [512, nc]]